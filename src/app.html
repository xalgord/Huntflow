<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="The workspace for bug bounty hunters and pentesters: import scope and recon, write findings that export to HackerOne, Bugcrowd, Intigriti and YesWeHack, and deliver client-ready reports. Local-first and free."
    />
    <meta
      name="keywords"
      content="bug bounty, pentest, penetration testing, hackerone, bugcrowd, intigriti, yeswehack, recon, nuclei, subfinder, httpx, vulnerability report, cvss"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="HuntFlow" />
    <meta name="creator" content="xalgorix" />
    <meta property="og:site_name" content="HuntFlow by xalgorix" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HuntFlow — Recon to report, in one calm workspace" />
    <meta
      property="og:description"
      content="Scope, targets, findings and payouts in one local-first app for bug bounty hunters and pentesters."
    />
    <meta property="og:image" content="https://huntflow.xalgorix.com/screenshots/v3/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="750" />
    <meta property="og:image:alt" content="HuntFlow Today view for bug bounty hunters and pentesters" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HuntFlow — Recon to report, in one calm workspace" />
    <meta
      name="twitter:description"
      content="Scope, targets, findings and payouts in one local-first app for bug bounty hunters and pentesters."
    />
    <meta name="twitter:image" content="https://huntflow.xalgorix.com/screenshots/v3/og.png" />
    <meta name="twitter:image:alt" content="HuntFlow Today view for bug bounty hunters and pentesters" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HuntFlow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
    <script>
      // Paint the saved appearance before hydration (settings live in
      // IndexedDB, which is async). Mirrors settingsStore.applyAppearance.
      (function () {
        var root = document.documentElement;
        var prefs = {};
        try {
          prefs = JSON.parse(localStorage.getItem('huntflow-appearance') || '{}') || {};
        } catch (e) {}
        var theme = prefs.theme || 'system';
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.add(dark ? 'dark' : 'light');
        root.dataset.accent = prefs.accent || 'crimson';
        if (prefs.fontSize) root.dataset.fontSize = prefs.fontSize;
        if (prefs.transparency) root.dataset.transparency = prefs.transparency;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#050507' : '#f1f2f7');
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
