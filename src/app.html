<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="HuntFlow is a local-first pentest command center for tracking engagements, targets, test sessions, evidence, report drafts, and findings."
    />
    <meta
      name="keywords"
      content="pentest, penetration testing, vulnerability research, security notes, pentest workflow, report builder, security testing"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="HuntFlow" />
    <meta name="creator" content="xalgorix" />
    <meta property="og:site_name" content="HuntFlow by xalgorix" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HuntFlow — Local-First Pentest Workflow App" />
    <meta
      property="og:description"
      content="Track engagements, targets, test sessions, evidence, report drafts, and findings without spreadsheets or cloud lock-in."
    />
    <meta property="og:image" content="https://huntflow.xalgorix.com/screenshots/dashboard.png" />
    <meta property="og:image:width" content="1899" />
    <meta property="og:image:height" content="1070" />
    <meta property="og:image:alt" content="HuntFlow dashboard — the bug bounty command center" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HuntFlow — Local-First Pentest Workflow App" />
    <meta
      name="twitter:description"
      content="A local-first command center for authorized security testing and pentest engagements."
    />
    <meta name="twitter:image" content="https://huntflow.xalgorix.com/screenshots/dashboard.png" />
    <meta name="twitter:image:alt" content="HuntFlow dashboard — the bug bounty command center" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HuntFlow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
    <script>
      // Paint the saved appearance before hydration (settings live in
      // IndexedDB, which is async). Mirrors settingsStore.applyAppearance.
      (function () {
        var root = document.documentElement;
        var prefs = {};
        try {
          prefs = JSON.parse(localStorage.getItem('huntflow-appearance') || '{}') || {};
        } catch (e) {}
        var theme = prefs.theme || 'system';
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.add(dark ? 'dark' : 'light');
        root.dataset.accent = prefs.accent || 'crimson';
        if (prefs.fontSize) root.dataset.fontSize = prefs.fontSize;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#000000' : '#f5f5f7');
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
