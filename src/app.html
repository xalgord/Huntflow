<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="HuntFlow is a focused bug bounty workspace for target tracking, timed hunts, evidence notes, reports, payouts, and cloud sync."
    />
    <meta
      name="keywords"
      content="bug bounty, vulnerability research, security notes, hacker workflow, report builder, bounty income tracker"
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="HuntFlow" />
    <meta name="creator" content="HuntFlow" />
    <meta property="og:site_name" content="HuntFlow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HuntFlow | Bug bounty workflow OS" />
    <meta
      property="og:description"
      content="A focused workspace for bug bounty hunters to manage targets, sessions, notes, reports, payouts, and sync."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HuntFlow | Bug bounty workflow OS" />
    <meta
      name="twitter:description"
      content="Target tracking, timed hunts, evidence notes, report building, income tracking, and cloud sync in one dark workspace."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HuntFlow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/huntflow.svg" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
