<?xml version="1.0" encoding="UTF-8"?>
<!--
  HuntFlow favicon — three stacked chevron-cut slabs in white on a
  near-black tile, with a muted zinc lock-on accent on the centre slab.
  Mirrors the inline BrandMark SVG (the app's logo source of truth) so
  the browser tab, sidebar, and landing page all read as a single
  coherent brand. Colors: tile #111111 / stroke #262626 / accent #a1a1aa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#111111" stroke="#262626"/>
  <g fill="#ffffff">
    <path d="M7 7 L21 7 L25 10 L21 13 L7 13 L9.5 10 Z"/>
    <path d="M7 14 L21 14 L25 17 L21 20 L7 20 L9.5 17 Z"/>
    <path d="M7 21 L21 21 L25 24 L21 27 L7 27 L9.5 24 Z"/>
  </g>
  <path d="M14.8 16 L18 17 L14.8 18 L13.4 17 Z" fill="#a1a1aa"/>
</svg>
