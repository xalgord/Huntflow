<?xml version="1.0" encoding="UTF-8"?>
<!--
  HuntFlow PWA icon — full-bleed maskable variant. The mark sits in
  the central 80% safe area so iOS/Android masking (rounded square,
  squircle, circle) doesn't clip the slabs. Same composition as the
  favicon and the BrandMark SVG: three stacked chevron-cut slabs +
  muted zinc lock-on accent on a near-black field. Colors mirror the
  BrandMark logo: tile #111111 / accent #a1a1aa (no stroke here since
  the full-bleed background extends past any mask edge).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#111111"/>
  <!--
    All mark geometry is authored in the same 32-unit grid as the
    favicon, then scaled up 13× and centred. Keeping the accent
    diamond inside the same transform group prevents the previous
    drift bug where its literal pixel coords landed off-centre.
  -->
  <g transform="translate(256,256) scale(13) translate(-16,-16)">
    <g fill="#ffffff">
      <path d="M7 7 L21 7 L25 10 L21 13 L7 13 L9.5 10 Z"/>
      <path d="M7 14 L21 14 L25 17 L21 20 L7 20 L9.5 17 Z"/>
      <path d="M7 21 L21 21 L25 24 L21 27 L7 27 L9.5 24 Z"/>
    </g>
    <path d="M14.8 16 L18 17 L14.8 18 L13.4 17 Z" fill="#a1a1aa"/>
  </g>
</svg>
