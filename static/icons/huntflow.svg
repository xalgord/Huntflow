<?xml version="1.0" encoding="UTF-8"?>
<!--
  Maskable PWA icon. Full-bleed green background so the OS can crop it
  to whatever shape the install target prefers (circle on Android, rounded
  square on iOS / desktop). The reticle sits inside the central ~70%
  safe area so no glyph detail is ever clipped.
-->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>HuntFlow</title>
  <rect width="512" height="512" fill="#16a34a"/>
  <g transform="translate(96 96) scale(10)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
    <!-- Same geometry as favicon, scaled into the 32-unit safe-area grid -->
    <circle cx="16" cy="16" r="9.5"/>
    <line x1="16" y1="3.5" x2="16" y2="6"/>
    <line x1="16" y1="26" x2="16" y2="28.5"/>
    <line x1="3.5" y1="16" x2="6" y2="16"/>
    <line x1="26" y1="16" x2="28.5" y2="16"/>
    <line x1="16" y1="9" x2="16" y2="12.5"/>
    <line x1="16" y1="19.5" x2="16" y2="23"/>
    <line x1="9" y1="16" x2="12.5" y2="16"/>
    <line x1="19.5" y1="16" x2="23" y2="16"/>
  </g>
  <circle cx="256" cy="256" r="20" fill="#ffffff"/>
</svg>
